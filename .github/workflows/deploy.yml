name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # mise.toml に基づき node / pnpm をセットアップ
      # v5.2.0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7

      - run: pnpm install --frozen-lockfile

      # pnpm-workspace.yaml の games/* を一括ビルド
      - run: pnpm build

      # ポータルとビルド成果物を _site に組み立て
      - run: pnpm build:site

      # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5.0.1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
