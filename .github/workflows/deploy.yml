name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build games
        run: |
          mkdir -p _site
          shopt -s nullglob
          for dir in games/*/; do
            name=$(basename "$dir")
            if [ -f "$dir/package.json" ]; then
              echo "::group::Build $name"
              (cd "$dir" && npm install --no-audit --no-fund && npm run build -- --base=./)
              mkdir -p "_site/games/$name"
              cp -r "$dir/dist/." "_site/games/$name/"
              echo "::endgroup::"
            else
              # 静的ゲームはディレクトリをそのままコピー
              mkdir -p "_site/games/$name"
              cp -r "$dir/." "_site/games/$name/"
              find "_site/games/$name" -name node_modules -type d -prune -exec rm -rf {} +
            fi
          done

      - name: Copy portal
        run: |
          shopt -s nullglob
          for f in *.html *.css *.js *.png *.jpg *.svg *.ico; do
            cp "$f" _site/
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
