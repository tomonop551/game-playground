<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Playground</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1e2a;
      --text: #e6e8ee;
      --muted: #8b93a7;
      --accent: #6c8cff;
      --accent-hover: #8aa4ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1.5rem;
    }
    header { text-align: center; margin-bottom: 3rem; }
    h1 { font-size: 2.25rem; letter-spacing: 0.02em; }
    h1 span { color: var(--accent); }
    header p { color: var(--muted); margin-top: 0.75rem; font-size: 0.95rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 860px;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card h2 { font-size: 1.15rem; }
    .card p { color: var(--muted); font-size: 0.85rem; }
    .card .tech {
      margin-top: auto;
      padding-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--accent-hover);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    footer { margin-top: 3rem; color: var(--muted); font-size: 0.8rem; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>🎮 Game <span>Playground</span></h1>
    <p>さまざまなフロントエンド技術で作るWebゲームの実験場</p>
  </header>

  <main class="grid">
    <a class="card" href="games/tic-tac-toe/">
      <h2>◯×ゲーム</h2>
      <p>二人対戦の三目並べ。勝敗判定と引き分けに対応。</p>
      <span class="tech">Vanilla JS + Vite</span>
    </a>
    <!-- 新しいゲームを追加したら、ここにカードを追加してください -->
  </main>

  <footer>
    <a href="https://github.com/tomonop551/game-playground">GitHub リポジトリ</a>
  </footer>
</body>
</html>
